name: tests

on:
  push:
    branches: [main]
  pull_request:

# Changes arrive as pull requests: a pull request's branch is tested once, through its pull_request run, and a newer
# commit on it cancels the older run. Each push to main is its own group, so a waiting run is never replaced by a
# later push (a group keeps one pending run). Tags are not tested again: they mark commits main has tested.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FluidSynth and FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        # Without the recommended packages (two General MIDI soundfonts and video drivers, none of which the tests use):
        # they made up much of a 248 MB download that a slow mirror once stretched past 20 minutes.
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg libarchive-tools
      - name: Install FluidSynth and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install fluid-synth ffmpeg
      - name: Install the Python packages
        run: python -m pip install -r skills/music-production/requirements.txt pyyaml pytest
      - name: Set up the renderer with the system tools
        if: runner.os != 'Windows'
        run: python skills/music-production/scripts/bootstrap.py --system --runtime "$RUNNER_TEMP/runtime" --config "$RUNNER_TEMP/runtime/local-config.json"
      - name: Set up the renderer with the pinned portable tools and Surge XT (Windows)
        if: runner.os == 'Windows'
        run: python skills/music-production/scripts/bootstrap.py --runtime "$RUNNER_TEMP/runtime" --config "$RUNNER_TEMP/runtime/local-config.json"
      - name: Compile every script
        run: python -m compileall -q skills tests examples
      - name: Run the tests, renders included
        env:
          MUSIC_SKILL_CONFIG: ${{ runner.temp }}/runtime/local-config.json
          # A loop's Ogg Vorbis copy is optional for users; here it is required, so a missing encoder fails the run.
          # Not on macOS: Homebrew's ffmpeg has no Vorbis encoder (ffmpeg-full has it), so there the loop test notes
          # the copy as skipped, as it does for users with that FFmpeg.
          MUSIC_SKILL_REQUIRE_OGG: ${{ runner.os != 'macOS' && '1' || '' }}
        run: python -m pytest -q tests
