name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FluidSynth and FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fluidsynth ffmpeg libarchive-tools
      - name: Install FluidSynth and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install fluid-synth ffmpeg
      - name: Install the Python packages
        run: python -m pip install -r skills/music-production/requirements.txt pyyaml pytest
      - name: Set up the renderer with the system tools
        run: python skills/music-production/scripts/bootstrap.py --system --runtime "$RUNNER_TEMP/runtime" --config "$RUNNER_TEMP/runtime/local-config.json"
      - name: Compile every script
        run: python -m compileall -q skills tests examples
      - name: Run the tests, renders included
        env:
          MUSIC_SKILL_CONFIG: ${{ runner.temp }}/runtime/local-config.json
        run: python -m pytest -q tests
